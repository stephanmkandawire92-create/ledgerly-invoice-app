name: Billing checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  edge-functions:
    name: Edge Functions (Deno)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Lint
        working-directory: supabase/functions
        run: deno lint
      - name: Test
        working-directory: supabase/functions
        run: deno test tests/

  database:
    name: Schema and RPCs (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Run SQL tests
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
        run: ./supabase/tests/run_sql_tests.sh
