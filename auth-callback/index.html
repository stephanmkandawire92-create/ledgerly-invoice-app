<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#4f46e5">
<meta name="description" content="Secure Ledgerly account confirmation return page.">
<title>Ledgerly Account Confirmation</title>
<style>
:root {
  color-scheme: light;
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color: #0f172a;
  background: #f8fafc;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 24px;
}
main {
  width: min(100%, 540px);
  background: #ffffff;
  border: 1px solid #e2e8f0;
  border-radius: 24px;
  padding: clamp(28px, 6vw, 44px);
  box-shadow: 0 20px 45px -10px rgba(15, 23, 42, 0.08);
}
.brand {
  font-weight: 800;
  letter-spacing: 0.12em;
  color: #4f46e5;
  font-size: 14px;
}
.mark {
  width: 60px;
  height: 60px;
  border-radius: 18px;
  background: #eef2ff;
  color: #4f46e5;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 26px;
  font-weight: 700;
  margin: 28px 0 20px;
  transition: all 0.25s ease;
}
h1 {
  font-size: clamp(24px, 5vw, 30px);
  letter-spacing: -0.03em;
  margin: 0 0 12px;
  color: #0f172a;
  line-height: 1.25;
}
p {
  color: #475569;
  line-height: 1.6;
  margin: 0 0 18px;
  font-size: 15px;
}
.state-box {
  background: #f8fafc;
  border: 1px solid #e2e8f0;
  border-radius: 14px;
  padding: 14px 18px;
  margin: 16px 0 22px;
  font-size: 14px;
  color: #334155;
  line-height: 1.5;
}
.button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: #4f46e5;
  color: #ffffff;
  text-decoration: none;
  font-weight: 600;
  border-radius: 12px;
  padding: 13px 22px;
  margin-top: 6px;
  font-size: 15px;
  transition: background-color 0.2s ease;
}
.button:hover {
  background: #4338ca;
}
.hint {
  font-size: 13px;
  margin-top: 24px;
  border-top: 1px solid #f1f5f9;
  padding-top: 18px;
  color: #94a3b8;
}

/* State themes */
.success .mark { background: #ecfdf5; color: #059669; }
.warning .mark { background: #fffbeb; color: #d97706; }
.error .mark { background: #fef2f2; color: #dc2626; }
.loading .mark { background: #f1f5f9; color: #64748b; animation: pulse 1.5s infinite; }

@keyframes pulse {
  0% { transform: scale(1); opacity: 1; }
  50% { transform: scale(0.96); opacity: 0.6; }
  100% { transform: scale(1); opacity: 1; }
}
</style>
</head>
<body>
<main id="card">
  <div class="brand">LEDGERLY</div>
  <div class="mark" id="mark" aria-hidden="true">✉</div>
  <h1 id="title">Verifying confirmation link...</h1>
  <p id="message">Please wait while we check your verification link status with Supabase.</p>
  <div id="details" class="state-box" style="display:none;"></div>
  <a class="button" id="action-btn" href="#">Open Ledgerly</a>
  <p class="hint">Ledgerly Security: Never share confirmation links, passwords, or security credentials.</p>
</main>
<script>
(() => {
  const query = new URLSearchParams(window.location.search);
  const fragment = new URLSearchParams(window.location.hash.replace(/^#/, ""));

  const rawError = query.get("error_description") || query.get("error") ||
                   fragment.get("error_description") || fragment.get("error") || "";
  const errorCode = query.get("error_code") || fragment.get("error_code") || "";
  const code = query.get("code");
  const hasAccessToken = fragment.has("access_token");

  const title = document.getElementById("title");
  const message = document.getElementById("message");
  const mark = document.getElementById("mark");
  const card = document.getElementById("card");
  const details = document.getElementById("details");
  const btn = document.getElementById("action-btn");

  const lowerError = (rawError + " " + errorCode).toLowerCase();

  // Reset classes
  card.className = "";

  if (rawError || errorCode) {
    if (lowerError.includes("expired") || lowerError.includes("otp_expired")) {
      // 1. Link Expired State
      card.classList.add("warning");
      mark.textContent = "⏱";
      title.textContent = "Confirmation link expired";
      message.textContent = "This confirmation link has expired. For your security, email verification links are time-limited.";
      details.style.display = "block";
      details.textContent = "Please return to the Ledgerly app and sign in or sign up again to request a fresh confirmation link.";
    } else if (lowerError.includes("invalid") || lowerError.includes("not found") || lowerError.includes("token")) {
      // 2. Invalid Link State
      card.classList.add("error");
      mark.textContent = "✕";
      title.textContent = "Invalid confirmation link";
      message.textContent = "This email confirmation link is invalid or has already been used.";
      details.style.display = "block";
      details.textContent = "If you already confirmed your email, you can sign in directly in Ledgerly.";
    } else {
      // 3. Verification Error State
      card.classList.add("error");
      mark.textContent = "!";
      title.textContent = "Verification error";
      message.textContent = "An error occurred during verification.";
      details.style.display = "block";
      details.textContent = rawError || "The verification request could not be completed. Please try again.";
    }
  } else if (code || hasAccessToken) {
    // 4. Confirmation Redirected / Processing / Success State
    card.classList.add("success");
    mark.textContent = "✓";
    title.textContent = "Email confirmation processed";
    message.textContent = "Supabase has processed your confirmation link and returned you safely to Ledgerly.";
    details.style.display = "block";
    details.textContent = "You can now return to the Ledgerly application on your device and sign in.";
  } else {
    // 5. Direct Visit / Waiting State
    mark.textContent = "✉";
    title.textContent = "Confirm your Ledgerly account";
    message.textContent = "Open the confirmation link in the latest email sent by Ledgerly.";
    details.style.display = "block";
    details.textContent = "If you haven't received an email yet, check your spam folder or return to Ledgerly to request one.";
  }
})();
</script>
</body>
</html>
