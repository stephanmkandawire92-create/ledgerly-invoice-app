name: ledgerly
description: A professional offline-first quotes and invoices app.
publish_to: "none"
version: 1.0.0+1
environment:
  sdk: ">=3.3.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.3.2
  intl: ^0.19.0
  uuid: ^4.5.1
  pdf: ^3.11.1
  printing: ^5.13.4
  share_plus: ^10.1.2
  image_picker: ^1.1.2
  url_launcher: ^6.3.1
  supabase_flutter: ^2.9.1
  purchases_flutter: ^10.10.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  msix: ^3.16.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

msix_config:
  display_name: Ledgerly
  publisher_display_name: Ledgerly Inc
  identity_name: Ledgerly.InvoicesPro
  msix_version: 1.0.0.0
  capabilities: internetClient

flutter_launcher_icons:
  image_path: "assets/icon/ledgerly_icon.png"
  android: false
  ios: false
  windows:
    generate: true
    image_path: "assets/icon/ledgerly_icon.png"
  web:
    generate: true
    image_path: "assets/icon/ledgerly_icon.png"
